name: lint-and-test

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Linters for Go code
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Go
        uses: actions/setup-go@v3
        with:
          go-version: 1.25.x

      - name: Lint
        uses: golangci/golangci-lint-action@v7
        with:
          # v2.4.0+ required: official binaries must be built with Go >= project's go.mod version (1.25).
          version: v2.4
          args: --timeout=5m

  test:
    runs-on: ubuntu-latest
    name: Runs unit tests and test build
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Go
        uses: actions/setup-go@v3
        with:
          go-version: 1.25.x

      - name: Run tests
        run: make test

      - name: Test build
        run: make build
