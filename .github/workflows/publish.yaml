name: publish

# A release is a merge to main that changes VERSION. Other merges publish nothing.
# The workflow creates the vX.Y.Z tag and a draft release once the artifacts are uploaded.
#
# Commercial: firehose-metrics-transformer-<ver>.zip and firehose-metrics-transformer-fips-<ver>.zip,
# each with a .sha256, are written once and never replaced. The unversioned
# firehose-metrics-transformer.zip still tracks the newest release for existing deployments.
on:
  push:
    branches:
      - main
    paths:
      - VERSION

concurrency:
  group: publish
  cancel-in-progress: false

env:
  AWS_SERVERLESS_BUCKET: coralogix-serverless-repo
  AWS_DEFAULT_REGION: eu-central-1

jobs:
  # Both ZIPs are built before anything is uploaded, so a failed build cannot leave a version
  # published without its FIPS artifact.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          v=$(tr -d '[:space:]' < VERSION)
          [[ $v =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::VERSION '$v' is not X.Y.Z."; exit 1; }

          # A rerun of this commit is fine; a version tagged on another commit is not.
          # An annotated tag also lists its peeled ^{} line, which is the commit: prefer it.
          tagged=$(git ls-remote origin "refs/tags/v$v" "refs/tags/v$v^{}" | sort -k2 -r | awk 'NR==1{print $1}')
          if [ -n "$tagged" ] && [ "$tagged" != "$GITHUB_SHA" ]; then
            echo "::error::v$v is already released from $tagged. Bump VERSION."; exit 1
          fi
          # Catch a typo that would release an older version than the newest tag.
          newest=$(git ls-remote --tags --refs origin 'v*' | sed 's#.*refs/tags/v##' | sort -V | tail -1)
          if [ -z "$tagged" ] && [ -n "$newest" ] && [ "$(printf '%s\n%s\n' "$v" "$newest" | sort -V | tail -1)" != "$v" ]; then
            echo "::error::VERSION $v is older than the newest release v$newest."; exit 1
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26.x

      - name: Build and package
        run: make package

      - name: Build and package FIPS
        run: make package-fips

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: firehose-metrics-transformer*.zip
          if-no-files-found: error

  publish:
    needs: build
    environment: production
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.S3_ROLE_ARN }}
          aws-region: ${{ env.AWS_DEFAULT_REGION }}

      # upload-versioned.sh refuses a version another commit already published.
      - name: Publish to S3
        run: |
          bucket=$AWS_SERVERLESS_BUCKET-$AWS_DEFAULT_REGION
          for name in firehose-metrics-transformer firehose-metrics-transformer-fips; do
            bash ci/upload-versioned.sh "dist/$name.zip" "$bucket" "$name-$VERSION.zip"
          done
          # "Latest" is copied from the versioned object so both hold the same bytes.
          bash ci/put-latest.sh "s3://$bucket/firehose-metrics-transformer-$VERSION.zip" \
            "$bucket" firehose-metrics-transformer.zip "$VERSION"

          # Release assets are the published objects, not this run's build.
          mkdir release
          for name in firehose-metrics-transformer firehose-metrics-transformer-fips; do
            for key in "$name-$VERSION.zip" "$name-$VERSION.zip.sha256"; do
              aws s3 cp --only-show-errors "s3://$bucket/$key" release/
            done
          done

      # Tag only after the upload succeeded, so a tag always has its artifacts.
      - name: Tag the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! git ls-remote --exit-code origin "refs/tags/v$VERSION" >/dev/null; then
            gh api "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/v$VERSION" -f sha="$GITHUB_SHA" >/dev/null
          fi

      - name: Create a draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          draft: true
          generate_release_notes: true
          files: release/*

