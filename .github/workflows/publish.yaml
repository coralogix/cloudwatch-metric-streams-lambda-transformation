name: publish

# A release is a pushed vX.Y.Z tag. Merging to main publishes nothing.
#
# Commercial: firehose-metrics-transformer-<ver>.zip and firehose-metrics-transformer-fips-<ver>.zip,
# each with a .sha256, are written once and never replaced. The unversioned
# firehose-metrics-transformer.zip still tracks the newest release for existing deployments.
on:
  push:
    tags:
      - 'v*'

concurrency:
  group: publish-${{ github.ref_name }}
  cancel-in-progress: false

env:
  AWS_SERVERLESS_BUCKET: coralogix-serverless-repo
  AWS_DEFAULT_REGION: eu-central-1

jobs:
  # Both ZIPs are built before anything is uploaded, so a failed build cannot leave a version
  # published without its FIPS artifact.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Read version from tag
        id: version
        run: |
          v=${GITHUB_REF_NAME#v}
          [[ $v =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Tag $GITHUB_REF_NAME is not vX.Y.Z."; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26.x

      - name: Build and package
        run: make package

      - name: Build and package FIPS
        run: make package-fips

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: firehose-metrics-transformer*.zip
          if-no-files-found: error

  publish:
    needs: build
    environment: production
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: write
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.S3_ROLE_ARN }}
          aws-region: ${{ env.AWS_DEFAULT_REGION }}

      # upload-versioned.sh refuses a version another commit already published.
      - name: Publish to S3
        run: |
          bucket=$AWS_SERVERLESS_BUCKET-$AWS_DEFAULT_REGION
          for name in firehose-metrics-transformer firehose-metrics-transformer-fips; do
            bash ci/upload-versioned.sh "dist/$name.zip" "$bucket" "$name-$VERSION.zip"
          done
          # "Latest" is copied from the versioned object so both hold the same bytes.
          bash ci/put-latest.sh "s3://$bucket/firehose-metrics-transformer-$VERSION.zip" \
            "$bucket" firehose-metrics-transformer.zip "$VERSION"

          # Release assets are the published objects, not this run's build.
          mkdir release
          for name in firehose-metrics-transformer firehose-metrics-transformer-fips; do
            for key in "$name-$VERSION.zip" "$name-$VERSION.zip.sha256"; do
              aws s3 cp --only-show-errors "s3://$bucket/$key" release/
            done
          done

      - name: Create a draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: release/*

